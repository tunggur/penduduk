<script>
    // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    // !!! GANTI URL DI BAWAH INI DENGAN URL APLIKASI WEB ANDA !!!
    // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyFvSJEn_hh18kVeAKID0b2X9_2VDdsUH8TWCKUumUY8dA5JkmGO5r1UK8PvnUVbiUUEQ/exec';
    
    // Kunci untuk menyimpan status sesi di localStorage
    const SESSION_KEY = 'isLoggedIn_Kependudukan';
    
    // Daftar Header untuk tabel data
    const HEADERS = [
        'No. KK', 'Nama KK', 'Alamat', 'RT', 'RW', 
        'NIK', 'Nama Lengkap', 'Jenis Kelamin', 
        'Tempat Lahir', 'Tgl. Lahir', 'Akta Lahir', 
        'Golongan Darah', 'Agama', 'Status', 
        'Akta Nikah', 'Tgl. Perkawinan', 
        'Aktat Cerai', 'Tgl. Perceraian', 'SHBKEL', 
        'Kelainan', 'Disabilitas', 'Pendidikan', 
        'Pekerjaan', 'NIK Ibu', 'Nama Ibu', 'NIK Ayah', 'Nama Ayah'
    ];

    // Elemen Login
    const loginPage = document.getElementById('loginPage');
    const searchPage = document.getElementById('searchPage');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const loginButton = document.getElementById('loginButton');
    const loginMessage = document.getElementById('loginMessage');
    
    // Elemen Pencarian
    const searchButton = document.getElementById('searchButton');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');
    const loadingIndicator = document.getElementById('loading');

    // --- FUNGSI UTAMA ---
    
    // Fungsi untuk menampilkan halaman pencarian
    function showSearchPage() {
        loginPage.style.display = 'none';
        searchPage.style.display = 'block';
    }

    // Fungsi untuk Logout
    
    function performLogout() {
        localStorage.removeItem(SESSION_KEY);
        alert("Anda telah logout.");
        window.location.reload(); // Muat ulang halaman untuk kembali ke login
    }
    
    // Fungsi untuk menambahkan tombol Logout
        function addLogoutButton() {
            // 1. Ambil elemen div mainHeader
            const mainHeader = document.getElementById('mainHeader');

            // **PENTING:** Cek apakah mainHeader ada sebelum melanjutkan
            if (!mainHeader) {
                console.error('Elemen dengan ID "mainHeader" tidak ditemukan.');
                return;
            }
            
            // 2. Cek jika tombol sudah ada agar tidak duplikasi (Cek di dalam mainHeader)
            if (mainHeader.querySelector('#logoutButton')) return; 

            // Tidak perlu 'const h1 = searchPage.querySelector('h1');' jika tidak digunakan

            const logoutBtn = document.createElement('button');
            logoutBtn.id = 'logoutButton';
            logoutBtn.textContent = 'Logout';
            logoutBtn.onclick = performLogout;
            
            // 3. Tambahkan tombol Logout ke dalam elemen mainHeader
            mainHeader.appendChild(logoutBtn);
        }
    
    // --- FUNGSI LOGIN ---
    async function handleLogin() {
        const username = loginUsername.value.trim();
        const password = loginPassword.value.trim();

        if (!username || !password) {
            loginMessage.className = 'error';
            loginMessage.textContent = 'Harap isi semua kolom.';
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = 'Masuk...';
        loginMessage.textContent = '';
        
        try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: JSON.stringify({ username: username, password: password })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            if (data.success) {
                loginMessage.className = 'success';
                loginMessage.textContent = data.message;
                
                // *** MODIFIKASI SESI: SIMPAN STATUS LOGIN ***
                localStorage.setItem(SESSION_KEY, 'true'); 
                
                // Tampilkan halaman pencarian setelah sukses
                setTimeout(() => {
                    showSearchPage();
                    addLogoutButton();
                }, 500);
            } else {
                loginMessage.className = 'error';
                loginMessage.textContent = data.message;
            }

        } catch (error) {
            console.error('Error during login:', error);
            loginMessage.className = 'error';
            loginMessage.textContent = 'Gagal terhubung ke server. Cek koneksi atau URL Apps Script.';
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = 'Masuk';
        }
    }
    
    // --- FUNGSI PENCARIAN & TAMPILKAN HASIL (TIDAK BERUBAH) ---
    async function performSearch() {
        const query = searchInput.value.trim();

        if (query === "") {
            resultsContainer.innerHTML = '<div id="message">Silakan masukkan kata kunci untuk memulai pencarian.</div>';
            return;
        }

        loadingIndicator.style.display = 'block';
        resultsContainer.innerHTML = '';

        try {
            const response = await fetch(`${GAS_URL}?query=${encodeURIComponent(query)}`);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();

            loadingIndicator.style.display = 'none';

            if (data.error) {
                throw new Error(data.error);
            }

            displayResults(data);

        } catch (error) {
            loadingIndicator.style.display = 'none';
            console.error('Error fetching data:', error);
            resultsContainer.innerHTML = `<div id="message" style="color: red;">Terjadi kesalahan: ${error.message}</div>`;
        }
    }
    
    function displayResults(data) {
        resultsContainer.innerHTML = '';

        if (data.length === 0) {
            resultsContainer.innerHTML = '<div id="message">Data tidak ditemukan.</div>';
            return;
        }

        const table = document.createElement('table');
        
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        HEADERS.forEach(headerText => {
            const th = document.createElement('th');
            th.textContent = headerText;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        data.forEach(rowData => {
            const tr = document.createElement('tr');
            
            HEADERS.forEach(headerKey => {
                const td = document.createElement('td');
                td.textContent = rowData[headerKey] || '';
                tr.appendChild(td);
            });
            
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        resultsContainer.appendChild(table);
    }

    // --- LOGIKA UTAMA: CEK SESI SAAT HALAMAN DIMUAT ---
    
    document.addEventListener('DOMContentLoaded', () => {
        // Cek apakah ada status login di localStorage
        if (localStorage.getItem(SESSION_KEY) === 'true') {
            showSearchPage();
            addLogoutButton();
        }
        
        // Event Listeners untuk Login (tetap dipertahankan)
        loginButton.addEventListener('click', handleLogin);
        loginPassword.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                handleLogin();
            }
        });
        
        // Event Listeners untuk Pencarian (tetap dipertahankan)
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });
    });

</script>
